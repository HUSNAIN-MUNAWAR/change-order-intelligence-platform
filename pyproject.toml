[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sledge-change-order-extractor"
version = "0.1.0"
description = "Evidence-backed construction change-order extraction"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "PyMuPDF>=1.25,<2", "simplejson>=3.19,<4"]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13,<0.4", "Pillow>=11,<13"]
llm = ["openai>=2,<3"]
ui = ["streamlit>=1.66,<2"]
api = ["fastapi>=0.115,<1", "python-multipart>=0.0.20,<1", "uvicorn[standard]>=0.34,<1", "httpx>=0.27,<1"]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "reportlab>=4.3,<5", "httpx>=0.27,<1"]

[project.scripts]
changeorder = "changeorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "--strict-markers"
markers = ["ocr: genuine local OCR integration; skipped when Tesseract/English data is unavailable"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tmp", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
